ytdl-format='bestvideo+bestaudio/best'
ytdl-raw-options='extractor-args="youtubepot-bgutilhttp:base_url=http://127.0.0.1:4416",retry-sleep=5,retries=infinite,cookies-from-browser=chromium:~/.local/share/scratchqbg/data/webengine/'
# ytdl-format='bestvideo+bestaudio/best'



# __     _____ ____  _____ ___
# \ \   / /_ _|  _ \| ____/ _ \
#  \ \ / / | || | | |  _|| | | |
#   \ V /  | || |_| | |__| |_| |
#    \_/  |___|____/|_____\___/
#

# profile=enc-f-webm
# profile=gpu-hq
vulkan-device='Intel(R) Graphics (RPL-U)'
gpu-api=vulkan
gpu-context=x11vk
vo=gpu-next
hwdec=vaapi

# Raptor Lake specific Vulkan optimizations
vulkan-async-compute=yes
vulkan-async-transfer=yes
vulkan-queue-count=1

# https://gist.github.com/agyild/7e8951915b2bf24526a9343d951db214
# glsl-shader="~~/NVScaler.glsl"

# # https://github.com/igv/FSRCNN-TensorFlow/releases
# glsl-shader="~~/FSRCNNX_x2_16-0-4-1.glsl"
#
# # https://gist.github.com/igv/2364ffa6e81540f29cb7ab4c9bc05b6b
# glsl-shader="~~/SSimSuperRes.glsl"
#
# # https://gist.github.com/igv/36508af3ffc84410fe39761d6969be10
# glsl-shader="~~/SSimDownscaler.glsl"

# glsl-shader="~~/KrigBilateral.glsl"
# glsl-shader="~~/FSRCNNX_x2_16-0-4-1.glsl"
# glsl-shader="~~/SSimSuperRes.glsl"
# glsl-shader="~~/SSimDownscaler.glsl"
glsl-shader="~~/NVScaler.glsl"
# glsl-shader="~~/NVSharpen.glsl"
# glsl-shader="~~/adaptive-sharpen.glsl"
# glsl-shader="~~/FSR.glsl"
# glsl-shader="~~/CAS-scaled.glsl"

linear-downscaling=no
no-scaler-resizes-only

scale=ewa_lanczossharp
dscale=spline36
cscale=spline36



# __        _____ _   _ ____   _____        __
# \ \      / /_ _| \ | |  _ \ / _ \ \      / /
#  \ \ /\ / / | ||  \| | | | | | | \ \ /\ / /
#   \ V  V /  | || |\  | |_| | |_| |\ V  V /
#    \_/\_/  |___|_| \_|____/ \___/  \_/\_/
